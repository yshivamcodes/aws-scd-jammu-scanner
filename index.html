<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AWS SCD Jammu 2026 — Check-in</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f3f4f6;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    .subtitle {
      margin-top: 6px;
      margin-bottom: 20px;
      color: #666;
    }

    .scanner-info {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      font-size: 19px;
      font-weight: bold;
      word-break: break-word;
      background: #eeeeee;
    }

    .approved {
      background: #d9f7df !important;
      color: #176b2c;
    }

    .denied {
      background: #ffe0e0 !important;
      color: #9b1c1c;
    }

    .processing {
      background: #fff3cd !important;
      color: #765600;
    }

    button {
      margin-top: 18px;
      padding: 13px 24px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .participant {
      margin-top: 10px;
      font-size: 15px;
      font-weight: normal;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>AWS SCD Jammu 2026</h1>

  <div class="subtitle">
    Event Check-in Scanner
  </div>

  <div class="scanner-info">
    Scanner: <strong>SCD26-SC001</strong><br>
    Volunteer: <strong>SCD26-V001</strong>
  </div>

  <div id="reader"></div>

  <div id="result">
    Point the camera at a participant QR code.
  </div>

  <button id="restartButton" onclick="restartScanner()">
    Scan Next Participant
  </button>

</div>


<script>

  /*
   * YOUR APPS SCRIPT WEB APP URL
   */
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw-5L64mgPOq8P6nmz8V3RNUQX6K43fad5N-RhNVhgUc9PkUn3PXKmeL-TRVGvlENgV/exec";


  const SCANNER_ID = "SCD26-SC001";
  const VOLUNTEER_ID = "SCD26-V001";

  let scanner = null;
  let scanning = false;
  let processing = false;


  function showResult(message, className = "") {

    const result =
      document.getElementById("result");

    result.innerHTML = message;
    result.className = className;
  }


  function startScanner() {

    if (scanning || processing) {
      return;
    }

    scanner =
      new Html5Qrcode("reader");


    scanner.start(
      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },


      function(decodedText) {

        if (processing) {
          return;
        }

        processing = true;
        scanning = false;

        processCheckin(decodedText);
      },


      function(errorMessage) {
        // Normal scanning errors are ignored.
      }

    )

    .then(function() {

      scanning = true;

      showResult(
        "Camera active.<br>Point it at a participant QR code."
      );

    })

    .catch(function(error) {

      scanning = false;

      showResult(
        "Camera failed:<br>" + error,
        "denied"
      );

    });
  }


  function processCheckin(scannedValue) {

    showResult(
      "⏳ Checking participant...<div class='participant'>" +
      escapeHtml(scannedValue) +
      "</div>",
      "processing"
    );


    if (scanner) {

      scanner.stop()
        .catch(function(error) {
          console.log(error);
        });
    }


    /*
     * The QR currently contains the participant ID.
     *
     * Example:
     * SCD26-P00002
     */

    const participantId =
      String(scannedValue).trim();


    /*
     * JSONP callback name
     */

    const callbackName =
      "scdCallback_" +
      Date.now();


    window[callbackName] =
      function(response) {

        try {

          handleCheckinResponse(
            response,
            participantId
          );

        } finally {

          delete window[callbackName];

          const script =
            document.getElementById(callbackName);

          if (script) {
            script.remove();
          }
        }
      };


    const url =
      APPS_SCRIPT_URL +
      "?api=checkin" +
      "&participantId=" +
      encodeURIComponent(participantId) +
      "&scannerId=" +
      encodeURIComponent(SCANNER_ID) +
      "&volunteerId=" +
      encodeURIComponent(VOLUNTEER_ID) +
      "&callback=" +
      encodeURIComponent(callbackName);


    const script =
      document.createElement("script");

    script.id = callbackName;
    script.src = url;

    script.onerror =
      function() {

        delete window[callbackName];

        showResult(
          "❌ Unable to contact the check-in server.",
          "denied"
        );

        processing = false;
      };


    document.body.appendChild(script);
  }


  function handleCheckinResponse(
    response,
    participantId
  ) {

    if (
      response &&
      response.success === true &&
      response.result === "APPROVED"
    ) {

      showResult(
        "🟢 CHECK-IN APPROVED" +
        "<div class='participant'>" +
        "Participant: " +
        escapeHtml(participantId) +
        "<br>" +
        escapeHtml(response.reason || "") +
        "</div>",
        "approved"
      );

    } else {

      showResult(
        "🔴 CHECK-IN DENIED" +
        "<div class='participant'>" +
        "Participant: " +
        escapeHtml(participantId) +
        "<br>" +
        escapeHtml(
          response && response.reason
            ? response.reason
            : "Check-in could not be approved."
        ) +
        "</div>",
        "denied"
      );
    }
  }


  function restartScanner() {

    processing = false;

    document.getElementById("reader").innerHTML = "";

    showResult(
      "Starting camera..."
    );

    setTimeout(
      startScanner,
      300
    );
  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  window.onload =
    function() {

      startScanner();

    };

</script>

</body>
</html>
